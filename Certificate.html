<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF Viewer</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f1f3f4;
            user-select: none; /* Disable text selection */
        }

        .header {
            height: 60px;
            background: #ffffff;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            border-bottom: 1px solid #ddd;
        }

        .header h2 {
            margin: 0;
            font-size: 18px;
        }

        .unlock-btn {
            padding: 6px 12px;
            background: #1a73e8;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
        }

        .unlock-btn:hover {
            background: #1557b0;
        }

        .viewer-container {
            width: 100%;
            height: calc(100vh - 60px);
            padding: 10px;
            position: relative;
        }

        .pdf-viewer {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
            background: white;
        }

        /* 50% Blur & Semi-Transparent Layer (Active by default) */
        .blur-overlay {
            position: absolute;
            top: 10px;
            left: 10px;
            right: 10px;
            bottom: 10px;
            background: rgba(255, 255, 255, 0.5); 
            backdrop-filter: blur(5px); 
            pointer-events: none; 
            z-index: 5;
            transition: backdrop-filter 0.3s ease, background 0.3s ease;
        }

        /* Invisible shield covering the pop-out/download button area in the top-right corner */
        .block-overlay {
            position: absolute;
            top: 10px;
            right: 10px;
            width: 70px;
            height: 60px;
            background: transparent;
            z-index: 10;
        }
    </style>
</head>

<body>

    <div class="header">
        <h2>Pankaj Certificates (Ask to Pankaj)</h2>
        <button class="unlock-btn" onclick="unlockViewer()">Enter Password</button>
    </div>

    <div class="viewer-container">
        <!-- 50% Blur Overlay Layer -->
        <div class="blur-overlay" id="blurOverlay"></div>

        <!-- Transparent shield blocking the top right corner -->
        <div class="block-overlay"></div>

        <iframe
            class="pdf-viewer"
            src="https://drive.google.com/file/d/1b-98_9HjSR1UThpYMd1p75YRCKG7a2EM/preview"
            sandbox="allow-scripts allow-same-origin"
            allow="autoplay">
        </iframe>
    </div>

    <script>
        function unlockViewer() {
            const password = prompt("Enter password to unlock viewer:");
            
            if (password === "902284") {
                // Remove blur effect
                const overlay = document.getElementById("blurOverlay");
                overlay.style.backdropFilter = "none";
                overlay.style.background = "transparent";
                
                // Optional: hide button after unlocking
                document.querySelector(".unlock-btn").style.display = "none";
                alert("Document unlocked successfully!");
            } else if (password !== null) {
                alert("Incorrect password. Please try again.");
            }
        }

        // Disable right-click on the page
        document.addEventListener("contextmenu", function(event) {
            event.preventDefault();
        });

        // Disable common save/print shortcuts
        document.addEventListener("keydown", function(event) {
            if (event.ctrlKey && (event.key.toLowerCase() === "s" || event.key.toLowerCase() === "p" || event.key.toLowerCase() === "u")) {
                event.preventDefault();
            }
        });
    </script>

</body>
</html>
