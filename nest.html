<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF Viewer</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f1f3f4;
            user-select: none; /* Disable text selection */
        }

        .header {
            height: 60px;
            background: #ffffff;
            display: flex;
            align-items: center;
            padding: 0 20px;
            border-bottom: 1px solid #ddd;
        }

        .header h2 {
            margin: 0;
            font-size: 18px;
        }

        .viewer-container {
            width: 100%;
            height: calc(100vh - 60px);
            padding: 10px;
            position: relative; /* Needed to position the block overlay */
        }

        .pdf-viewer {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
            background: white;
        }

        /* Invisible shield covering the pop-out/download button area in the top-right corner */
        .block-overlay {
            position: absolute;
            top: 10px;
            right: 10px;
            width: 70px;
            height: 60px;
            background: transparent; /* Change to red/blue temporarily to test alignment */
            z-index: 10;
        }
    </style>
</head>

<body>

    <div class="header">
        <h2>Pankaj nesting Automatic Generated Report</h2>
    </div>

    <div class="viewer-container">
        <!-- Transparent shield blocking the top right corner -->
        <div class="block-overlay"></div>

        <iframe
            class="pdf-viewer"
            src="https://drive.google.com/file/d/17eWxDh0mLEsEqjpWIgR7lxNZoBUUu_PJ/preview"       
            sandbox="allow-scripts allow-same-origin"
            allow="autoplay">
        </iframe>
    </div>

    <script>
        // Disable right-click on the page
        document.addEventListener("contextmenu", function(event) {
            event.preventDefault();
        });

        // Disable common save/print shortcuts
        document.addEventListener("keydown", function(event) {
            if (event.ctrlKey && (event.key.toLowerCase() === "s" || event.key.toLowerCase() === "p" || event.key.toLowerCase() === "u")) {
                event.preventDefault();
            }
        });
    </script>

</body>
</html>
